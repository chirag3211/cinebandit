# CineBandit — Docker Compose
# Start: docker compose up -d
# Stop:  docker compose down

networks:
  cinebandit:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:
  model_artifacts:
  airflow_logs:
  prometheus_data:
  grafana_data:

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstY="
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: "cinebandit-secret-key"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
  AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
  AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
  AIRFLOW__CORE__HOSTNAME_CALLABLE: "socket.getfqdn"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  API_URL: http://api:8000

services:

  postgres:
    image: postgres:15-alpine
    container_name: cinebandit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinebandit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: cinebandit_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - cinebandit
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install psycopg2-binary --quiet &&
      mlflow server
      --backend-store-uri postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: cinebandit_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODEL_PATH: /app/outputs/linucb_alpha0.1.pkl
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONUNBUFFERED: "1"
    volumes:
      - model_artifacts:/app/outputs
      - ./data:/app/data:ro
    networks:
      - cinebandit
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cinebandit_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      PYTHONUNBUFFERED: "1"
    networks:
      - cinebandit
    ports:
      - "8501:8501"

  airflow-init:
    image: apache/airflow:2.10.0-python3.12
    container_name: cinebandit_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    user: root
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - model_artifacts:/opt/airflow/outputs
      - ./docker/airflow-init.sh:/airflow-init.sh:ro
      - ./train_mlflow.py:/opt/airflow/train_mlflow.py:ro
      - ./train.py:/opt/airflow/train.py:ro
    networks:
      - cinebandit
    entrypoint: ["/bin/bash", "/airflow-init.sh"]
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.10.0-python3.12
    container_name: cinebandit_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - model_artifacts:/opt/airflow/outputs
      - ./train_mlflow.py:/opt/airflow/train_mlflow.py:ro
      - ./train.py:/opt/airflow/train.py:ro
    networks:
      - cinebandit
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.0-python3.12
    container_name: cinebandit_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - model_artifacts:/opt/airflow/outputs
      - ./train_mlflow.py:/opt/airflow/train_mlflow.py:ro
      - ./train.py:/opt/airflow/train.py:ro
    networks:
      - cinebandit
    command: scheduler

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cinebandit_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cinebandit
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cinebandit_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cinebandit
    ports:
      - "3000:3000"